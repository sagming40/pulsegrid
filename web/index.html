<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PULSEGRID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
        <h1 style="margin: 0;">PULSEGRID</h1>
        <span id="connection-status" style="font-size: 0.85em; padding: 4px 10px; border-radius: 4px; background: #4caf50; color: white;">● 실시간 연결</span>

        <!-- ⭐ M6.5 Task 6.5-7c — 테마 설정 톱니바퀴 -->
        <div id="theme-settings" style="position: relative; margin-left: auto;">
            <button id="theme-toggle-btn" style="background: none; border: none; font-size: 1.3em; cursor: pointer; padding: 4px 8px;">⚙️</button>
            <div id="theme-menu" style="display: none; position: absolute; right: 0; top: 100%; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: 8px; padding: 8px; margin-top: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10;">
                <button class="theme-option" data-theme="system" style="display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--color-text-primary); border-radius: 4px;">🖥️ 시스템 설정</button>
                <button class="theme-option" data-theme="light" style="display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--color-text-primary); border-radius: 4px;">☀️ 라이트</button>
                <button class="theme-option" data-theme="dark" style="display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--color-text-primary); border-radius: 4px;">🌙 다크</button>
            </div>
        </div> 
    </div>
    <div id="cards-container"></div>

    <div style="margin-top: 24px; width: 100%; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: 10px; padding: 16px; box-sizing: border-box;">
        <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 12px">
            <label>
                기기:
                <select id="history-device-select"></select>
            </label>
            <label>
                기간:
                <select id="history-range-select">
                    <option value="live">실시간</option>
                    <option value="60">최근 1시간</option>
                    <option value="360">최근 6시간</option>
                    <option value="1440">최근 24시간</option>
                </select>
            </label>
        </div>
        <div style="position: relative; height: 300px;">
            <canvas id="trend-chart" height="100"></canvas>
        </div>
    </div>

    <!-- M6.5 Task 6.5-3: 시간대별 CPU 히트맵 영역 -->
    <section id="heatmap-section">
        <h3>시간대별 CPU 사용률 히트맵</h3>
        <div id="heatmap-container"></div>
    </section>
    <script src="app.js"></script>
</body>    
</html>
